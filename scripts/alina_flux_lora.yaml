job: extension
config:
  name: alina_flux_v1
  process:
    - type: sd_trainer
      training_folder: /workspace/Grok-AI-model/dataset/alina_flux
      device: cuda:0
      network:
        type: lora
        linear: 16
        linear_alpha: 16
      save:
        dtype: bf16
        save_every: 250
        max_step_saves_to_keep: 4
        output_dir: /workspace/runpod-slim/ComfyUI/models/loras
      datasets:
        - folder_path: /workspace/ai-studio-tools/lora_dataset/alina_v2/img
          caption_ext: txt
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768, 1024]
      train:
        batch_size: 1
        steps: 1500
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: 0.0001
        dtype: bf16
      model:
        name_or_path: /workspace/runpod-slim/ComfyUI/models/unet/flux1-dev-fp8.safetensors
        is_flux: true
        quantize: true
      sample:
        sampler: flowmatch
        sample_every: 250
        width: 768
        height: 1152
        prompts:
          - "alina23, portrait, dirty blonde hair, hazel eyes, warm lamp light"
trigger_word: alina23
