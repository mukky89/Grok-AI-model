---
job: extension
config:
  name: "alina_flux_v1"
  process:
    - type: 'sd_trainer'
      training_folder: "/workspace/Grok-AI-model/training_output"
      device: cuda:0
      trigger_word: "alina23"
      network:
        type: "lora"
        linear: 32
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 10
        push_to_hub: false
      datasets:
        - folder_path: "/workspace/ai-studio-tools/lora_dataset/alina_v2/img"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768, 1024]
      train:
        batch_size: 1
        steps: 4000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1.0e-4
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.1-dev"
        is_flux: true
        quantize: true
      sample:
        sampler: "flowmatch"
        sample_every: 500
        sample_start_step: 0
        width: 768
        height: 1152
        prompts:
          - "alina23, portrait, dirty blonde hair darker roots, hazel green-brown eyes, warm lamp light"
          - "alina23, sitting on a cream chair in a hotel bedroom, champagne slip, 35mm"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 20
meta:
  name: "[name]"
  version: "1.0"
