---
job: extension
config:
  name: "alina_flux_smoke"
  process:
    - type: 'sd_trainer'
      training_folder: "/workspace/Grok-AI-model/training_output"
      device: cuda:0
      trigger_word: "alina23"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 2
        max_step_saves_to_keep: 1
        push_to_hub: false
      datasets:
        - folder_path: "/workspace/ai-studio-tools/lora_dataset/alina_v2/img"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512]
      train:
        batch_size: 1
        steps: 2
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1.0e-4
        skip_first_sample: true
        disable_sampling: true
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.1-dev"
        is_flux: true
        quantize: true
      sample:
        sampler: "flowmatch"
        sample_every: 9999
        width: 512
        height: 512
        prompts:
          - "alina23 portrait"
        neg: ""
        seed: 1
        guidance_scale: 4
        sample_steps: 4
meta:
  name: "[name]"
  version: "1.0"
